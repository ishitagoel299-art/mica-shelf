<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The MICA Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FFE066; --panel:#FFFFFF; --ink:#3B2E8F; --muted:#6F64B8; --line:#7B4DFF;
  --board:#FF9F1C; --accent:#FF3E8A; --accent-ink:#FFFFFF; --go:#2F6BFF; --go-ink:#FFFFFF;
  --warn:#E5203A; --ok:#00A88F; --chip:#FFF5CC; --shadow:#FF9EC9;
  color-scheme:light;
  --sans:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --display:"Anton", "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 72px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 24px;margin-bottom:26px;position:relative}
h1{font-family:var(--display);font-weight:400;font-size:clamp(3.4rem,11vw,7.5rem);line-height:.88;margin:0;letter-spacing:.005em;text-transform:none}
.lede{margin:14px 0 0;max-width:42ch;font-size:1.1rem;font-weight:600}
.sticker{position:absolute;top:-6px;right:76px;transform:rotate(8deg);background:var(--accent);color:#fff;font-weight:800;font-size:.95rem;line-height:1.1;text-align:center;width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:12px;border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow)}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:3px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:800;font-size:.98rem;box-shadow:3px 3px 0 var(--shadow);transition:transform .1s, box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--go);color:var(--go-ink)}
.btn.hot{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.panel{background:var(--panel);border:3px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--shadow);padding:22px}

/* fresh strip */
.fresh{margin-bottom:28px}
.fresh h2,.shelf-head h2{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1;margin:0 0 16px}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:14px;box-shadow:5px 5px 0 var(--shadow);cursor:pointer;transition:transform .15s}
.card:nth-child(1){transform:rotate(-1.5deg)} .card:nth-child(2){transform:rotate(1deg)} .card:nth-child(3){transform:rotate(-.6deg)}
.card:hover{transform:rotate(0) translateY(-4px)}
.card .txt b{display:block;font-size:1.05rem;line-height:1.2}
.card .txt span{display:block;font-size:.85rem;color:var(--muted);font-weight:600;margin:2px 0 6px}
.card .txt p{margin:0;font-size:.9rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* generated covers */
.cv{flex:none;border-radius:3px 8px 8px 3px;border:3px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.cv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.18)}
.cv .ct{font-family:var(--display);line-height:1;position:relative;word-break:break-word}
.cv .ca{font-size:.62rem;font-weight:700;position:relative;margin-top:4px;opacity:.9}
.cv.sm{width:78px;height:112px}.cv.sm .ct{font-size:.95rem}
.cv.lg{width:110px;height:160px;padding:10px}.cv.lg .ct{font-size:1.3rem}

nav.tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
nav.tabs button{border:3px solid var(--line);background:transparent;padding:8px 18px;cursor:pointer;font-weight:800;border-radius:999px;color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--line);color:#fff}
.badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:8px;border-radius:11px;background:var(--accent);color:#fff;font-size:.78rem;line-height:22px;text-align:center}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.search{flex:1 1 240px;padding:11px 16px;border:3px solid var(--line);border-radius:12px;background:var(--panel);font-weight:600}
select.genre{padding:11px 12px;border:3px solid var(--line);border-radius:12px;background:var(--panel);font-weight:600}
label.toggle{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
label.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.count{font-weight:700;color:var(--muted)}

/* the shelf */
.shelf{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 6px;padding:0 10px;
  background-image:repeating-linear-gradient(to bottom, transparent 0 200px, var(--board) 200px 212px);
  min-height:212px;
}
.slot{height:200px;display:flex;align-items:flex-end}
.spine{
  position:relative;border:3px solid var(--line);border-bottom:none;cursor:pointer;border-radius:5px 5px 0 0;padding:16px 0;
  writing-mode:vertical-rl;display:flex;align-items:center;justify-content:space-between;gap:10px;
  text-align:left;overflow:hidden;transform-origin:bottom center;transition:transform .18s ease;
}
.spine:hover{transform:translateY(-10px) rotate(-2deg)}
.spine .t{font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;line-height:1;max-height:142px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spine .a{font-size:.62rem;font-weight:700;white-space:nowrap;max-height:34px;overflow:hidden;opacity:.85}
.spine.out{filter:saturate(.15) brightness(1.15);opacity:.45}
.spine.out:hover{opacity:.75}
.spine .flag{position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:14px;height:22px;writing-mode:horizontal-tb;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);display:none}
.spine.req .flag{display:block}
@media (prefers-reduced-motion: reduce){.spine,.card,.btn{transition:none}.spine:hover,.card:hover{transform:none}}

.legend{display:flex;gap:20px;flex-wrap:wrap;margin:16px 4px 0;font-size:.88rem;font-weight:700}
.legend i{display:inline-block;width:12px;height:18px;margin-right:7px;vertical-align:-4px;border:2px solid var(--line);border-radius:2px}

.empty{padding:44px 20px;text-align:center}
.empty strong{display:block;font-family:var(--display);font-weight:400;font-size:2.2rem;line-height:1.05;margin-bottom:8px}
.ghosts{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-bottom:20px;height:120px}
.ghosts i{display:block;width:30px;border:3px dashed var(--line);border-bottom:none;border-radius:4px 4px 0 0;opacity:.45}

.notice{padding:12px 16px;border-radius:12px;background:var(--chip);border:3px solid var(--line);margin-bottom:18px;font-weight:600}

/* your books */
.group{margin-bottom:30px}
.group h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0 0 10px}
.row{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:10px;border:3px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;width:100%;text-align:left;box-shadow:3px 3px 0 var(--shadow)}
.row:hover{transform:translate(-1px,-1px)}
.row .mini{width:16px;height:46px;border-radius:3px;flex:none;border:2px solid var(--line)}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-size:1.05rem}
.row .info span{color:var(--muted);font-size:.9rem;font-weight:600}
.row .state{font-size:.82rem;font-weight:800;white-space:nowrap;padding:4px 10px;border-radius:999px;background:var(--chip)}
.state.warn{background:var(--accent);color:#fff} .state.ok{color:var(--ok)}

/* dialogs */
dialog{border:3px solid var(--line);border-radius:22px;padding:0;background:var(--panel);color:var(--ink);width:min(580px,calc(100vw - 24px));max-height:calc(100% - 32px);box-shadow:8px 8px 0 var(--shadow)}
dialog::backdrop{background:rgba(255,224,102,.75);backdrop-filter:blur(3px)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:16px}
.dlg-head{display:flex;gap:18px;align-items:flex-start}
.dlg-head>div:not(.cv){flex:1;min-width:0}
.close{flex:none}
.dlg h2{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1;margin:0}
.dlg .by{color:var(--muted);margin:6px 0 0;font-weight:700}
.note{font-size:1.05rem;line-height:1.6;margin:0;padding:14px 16px;background:var(--chip);border-radius:14px;position:relative}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.facts dt{color:var(--muted);font-weight:600} .facts dd{margin:0;font-weight:800}
.status-line{padding:12px 14px;border-radius:12px;border:3px dashed var(--line);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:4px}
.close{margin-left:auto;border:none;background:none;font-size:1.8rem;line-height:1;cursor:pointer;padding:0 6px;font-weight:800}
form.fields{display:flex;flex-direction:column;gap:14px}
form.fields label{display:flex;flex-direction:column;gap:5px;font-size:.92rem;font-weight:800}
form.fields input,form.fields select,form.fields textarea{padding:10px 12px;border:3px solid var(--line);border-radius:12px;background:var(--panel);font-weight:500;font-size:1rem}
form.fields textarea{min-height:100px;resize:vertical}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-weight:600;color:var(--muted);font-size:.85rem}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:#fff;border:3px solid var(--line);font-weight:800;padding:10px 18px;border-radius:999px;box-shadow:3px 3px 0 var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}

@media (max-width:640px){
  .wrap{padding:20px 14px 60px}
  .sticker{display:none}
  h1{padding-right:62px}
  .panel{padding:16px}
  .pair{grid-template-columns:1fr}
  .cv.lg{width:84px;height:122px}.cv.lg .ct{font-size:1rem}
  .dlg h2{font-size:1.7rem}
  .covers{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:82%;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 10px 12px 4px;margin:0 -14px 0 0}
  .card{transform:none!important;scroll-snap-align:start}
}

.alert{padding:12px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800}
.queue-box{padding:12px 14px;border-radius:12px;background:var(--chip)}
.queue{margin:6px 0 0;padding-left:22px;font-weight:600}
.journey{border:3px solid var(--line);border-radius:12px;padding:10px 14px}
.journey summary{cursor:pointer;font-weight:800}
.trail{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:3px dotted var(--line)}
.trail li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;position:relative;font-weight:600}
.trail li::before{content:"";position:absolute;left:-22px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff}
.trail time{color:var(--muted);white-space:nowrap;font-size:.88rem}
form.fields label.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:600}
form.fields label.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.gate{text-align:center;max-width:520px;margin:10px auto 0}
.gate h2{font-family:var(--display);font-weight:400;font-size:2.2rem;margin:0 0 8px}
.gate p{margin:0 0 18px;font-weight:600}
.btn.link{border:none;background:none;box-shadow:none;padding:4px 6px;text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-weight:700}
.btn.link:hover{transform:none;box-shadow:none;color:var(--ink)}
.rate{display:inline-block;margin-top:4px;font-size:.85rem;font-weight:800;color:var(--accent)}
.card .txt .rate{color:var(--accent);margin:0 0 6px}
.dtabs{display:flex;gap:8px}
.dtabs button{border:3px solid var(--line);background:transparent;padding:6px 16px;border-radius:999px;font-weight:800;cursor:pointer;color:var(--ink)}
.dtabs button[aria-selected="true"]{background:var(--line);color:#fff}
.reviews{display:flex;flex-direction:column;gap:16px}
.rv-sum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rv-sum .big{font-family:var(--display);font-size:2.6rem;line-height:1}
.stars{color:#FF9F1C;letter-spacing:.08em;font-size:1.05rem}
.rv-form{padding:14px;border:3px dashed var(--line);border-radius:14px}
.star-pick{display:flex;gap:2px}
.star-pick button{border:none;background:none;font-size:2rem;line-height:1;color:#FF9F1C;cursor:pointer;padding:0 2px}
.star-pick button:hover{transform:scale(1.15)}
.rv-list{display:flex;flex-direction:column;gap:12px}
.rv{padding:12px 14px;border-radius:14px;background:var(--chip)}
.rv.mine{outline:3px solid var(--accent)}
.rv header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rv header time{margin-left:auto;color:var(--muted);font-size:.85rem;font-weight:600}
.rv p{margin:6px 0 0;white-space:pre-wrap}
.rv .tag{font-size:.72rem;font-weight:800;background:var(--line);color:#fff;padding:2px 8px;border-radius:999px}
.rv-acts{display:flex;gap:4px;justify-content:flex-end}
.btn.wa{background:#25D366;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.nudge{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:#E9FBEF;border:3px solid #25D366}
.nudge.soft{background:none;border:none;padding:0;align-items:flex-start}
.nudge span{font-weight:600}
.nudge .btn.wa{align-self:flex-start}
.bellwrap{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:30}
#bell{position:relative;width:54px;height:54px;border-radius:50%;border:3px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:3px 3px 0 var(--shadow);display:grid;place-items:center;cursor:pointer;transition:transform .1s}
#bell:hover{transform:rotate(-12deg)}
#bell[aria-expanded="true"]{background:var(--line);color:#fff}
.bubble{position:absolute;top:-7px;right:-7px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--accent);color:#fff;font-weight:800;font-size:.82rem;display:grid;place-items:center;border:3px solid var(--panel)}
#bellPanel{position:absolute;right:0;top:66px;width:min(380px,calc(100vw - 28px));max-height:min(70vh,560px);overflow:auto;background:var(--panel);border:3px solid var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--shadow);padding:16px}
#bellPanel h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0 0 10px}
.bp-empty{margin:4px 0 6px;font-weight:600;color:var(--muted)}
.bp-row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:none;background:none;border-radius:12px;padding:10px;cursor:pointer;font-weight:600;color:var(--ink)}
.bp-row:hover{background:var(--chip)}
.bp-row .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:transparent}
.bp-row.new{background:var(--chip)}
.bp-row.new .dot{background:var(--accent)}
.bp-row.act .t{font-weight:800}
.bp-foot{border-top:2px dashed var(--line);margin-top:10px;padding-top:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-weight:600}
.bp-foot p{margin:0}
@media (prefers-reduced-motion: reduce){#bell{transition:none}#bell:hover{transform:none}}
</style>
</head>
<body>
<div class="bellwrap">
  <button id="bell" type="button" aria-label="Notifications" aria-haspopup="true" aria-expanded="false" hidden>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    <span class="bubble" id="bellCount" hidden></span>
  </button>
  <div id="bellPanel" role="dialog" aria-label="Notifications" hidden></div>
</div>
<div class="wrap">
  <header class="top">
    <div>
      <h1>The MICA Shelf</h1>
      <p class="lede">Books your campus will lend you. See who has what, which room to knock on, and whether it's free right now.</p>
    </div>
    <div class="sticker" aria-hidden="true">Free to borrow</div>
    <div class="who">
      <button class="btn" id="signOut" type="button" hidden>Sign out</button>
      <button class="btn" id="profileBtn" type="button">Your details</button>
      <button class="btn primary" id="addBtn" type="button">Lend a book</button>
    </div>
  </header>

  <div id="gate" class="panel gate" hidden>
    <h2>Sign in to open the shelf</h2>
    <p>Use your Google account so people know who's lending and borrowing.</p>
    <button class="btn hot" id="signIn" type="button">Sign in with Google</button>
    <p id="gateMsg" class="hint"></p>
  </div>
  <div id="app">
  <div id="notice" class="notice" hidden></div>


  <nav class="tabs" role="tablist">
    <button role="tab" id="tabShelf" aria-selected="true" type="button">Shelf</button>
    <button role="tab" id="tabMine" aria-selected="false" type="button">Your books<span id="mineBadge" class="badge" hidden></span></button>
  </nav>

  <section id="viewShelf">
    <div id="fresh"></div>
    <div class="panel">
    <div class="shelf-head"><h2>Browse the shelf</h2><span class="count" id="count"></span></div>
    <div class="filters">
      <input class="search" id="q" type="search" placeholder="Search by title, author or owner" aria-label="Search books">
      <select class="genre" id="genreFilter" aria-label="Filter by genre"></select>
      <label class="toggle"><input type="checkbox" id="availOnly"> Available now</label>
    </div>
    <div id="shelf"></div>
    <div class="legend" id="legend">
      <span><i style="background:#2340FF"></i>Available</span>
      <span><i style="background:var(--accent)"></i>Someone asked for it</span>
      <span><i style="background:#ccc;opacity:.6"></i>Borrowed</span>
    </div>
    </div>
  </section>

  <section id="viewMine" hidden></section>
  </div>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* =========================================================
   1. PASTE YOUR FIREBASE CONFIG HERE (see README.md, step 1)
   ========================================================= */
const firebaseConfig = {

  authDomain: "mica-shelf.firebaseapp.com",

};
/* 2. OPTIONAL: only allow college Google accounts, e.g. "mica.ac.in".
      Leave "" while testing with friends' personal Gmail accounts. */
const ALLOWED_DOMAIN = "";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, collection, collectionGroup, getDoc, updateDoc, setDoc, deleteDoc, addDoc, onSnapshot, query, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const fs = getFirestore(fbApp);
const wrapSnap = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });
const firestoreDb = {
  doc: p => { const r = doc(fs, p); return {
    get: async () => wrapSnap(await getDoc(r)),
    update: d => updateDoc(r, d), set: d => setDoc(r, d), delete: () => deleteDoc(r) }; },
  collection: p => { const c = collection(fs, p); return {
    add: d => addDoc(c, d),
    limit: n => ({ onSnapshot: (next, err) => onSnapshot(query(c, limit(n)), s => next({ docs: s.docs.map(wrapSnap) }), err) }) }; },
  group: name => ({ onSnapshot: (next, err) => onSnapshot(query(collectionGroup(fs, name), limit(3000)), s => next({ docs: s.docs.map(wrapSnap) }), err) })
};

const $ = s => document.querySelector(s);
const el = (tag, props={}, kids=[]) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props)){
    if (k==="text") n.textContent = v;
    else if (k==="class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k==="style") n.setAttribute("style", v);
    else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v===true?"":v);
  }
  for (const c of [].concat(kids)) if (c!=null) n.append(c);

};

let unsubBooks = null, unsubReviews = null;
async function boot(){
  renderShelf();
  state.db = firestoreDb;
  onAuthStateChanged(auth, async u => {
    if (unsubBooks){ unsubBooks(); unsubBooks = null; }
    if (unsubReviews){ unsubReviews(); unsubReviews = null; }
    if (!u){
      state.uid = null; state.profile = null; state.books = []; state.loaded = false;
      $("#gate").hidden = false; $("#app").hidden = true; $("#signOut").hidden = true; return;
    }
    if (ALLOWED_DOMAIN && !(u.email||"").toLowerCase().endsWith("@" + ALLOWED_DOMAIN)){
      await signOut(auth);
      $("#gateMsg").textContent = `Sign in with your @${ALLOWED_DOMAIN} account to use the shelf.`;
      return;
    }
    $("#gate").hidden = true; $("#app").hidden = false; $("#signOut").hidden = false;
    state.uid = u.uid; state.canWrite = true; state.readOnly = false;
    try{
      const snap = await state.db.doc(`users/${u.uid}`).get();
      state.profile = snap.exists ? snap.data() : (u.displayName ? {name:u.displayName, block:"", room:"", _guess:true} : null);
    }catch(e){ state.profile = null; }
    unsubBooks = state.db.collection("books").limit(1000).onSnapshot(snap=>{
      state.books = snap.docs.map(d=>({id:d.id, ...d.data()}));
      state.loaded = true; notice(""); renderAll();
    }, err=>{
      notice(err && err.code==="permission-denied"
        ? "Your account can't read the shelf. Check the Firestore rules (README step 3)."
        : "Live updates stopped. Reload the page to reconnect.");
    });
    unsubReviews = state.db.group("reviews").onSnapshot(snap=>{
      const m = {};
      snap.docs.forEach(d=>{ const r = d.data(); if (r && r.bookId) (m[r.bookId] = m[r.bookId] || []).push(r); });
      state.reviews = m; state.reviewsError = false; renderAll();
    }, err=>{ state.reviewsError = true; renderAll(); });
    renderAll();
  });
}
$("#signIn").onclick = async ()=>{
  const p = new GoogleAuthProvider();
  if (ALLOWED_DOMAIN) p.setCustomParameters({hd: ALLOWED_DOMAIN});
  try{ await signInWithPopup(auth, p); }
  catch(e){ if (e.code!=="auth/popup-closed-by-user") $("#gateMsg").textContent = "Sign-in didn't work: " + (e.code||"unknown error") + ". If it says unauthorized-domain, see README step 2."; }
};

async function write(fn, okMsg){
  if (!state.db){ toast("The shelf isn't connected in this view."); return false; }
  if (!state.canWrite || state.readOnly){ toast("Your account can't make changes here."); return false; }
  try{ await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){
    if (e && e.code === "permission-denied") toast("You don't have permission to do that.");
    else if (e && e.code === "resource-exhausted") toast("The shelf hit its free daily limit. Try again tomorrow.");
    else toast("That didn't save. Check your connection and try again.");
    return false;
  }
}

        el("span",{class:"flag","aria-hidden":"true"}),

function reviewsFor(id){ return (state.reviews[id]||[]).slice().sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0)); }
function ratingStats(revs){ const r = revs.filter(x=>x.rating>0); return {count:r.length, avg: r.length ? r.reduce((s,x)=>s+x.rating,0)/r.length : 0}; }
const starsText = n => { const k = Math.round(n); return "★".repeat(k) + "☆".repeat(5-k); };
function rateLine(id){
  const revs = reviewsFor(id), st = ratingStats(revs);
  if (!revs.length) return null;
  const parts = [];
  if (st.count) parts.push(`★ ${st.avg.toFixed(1)}`);
  parts.push(`${revs.length} review${revs.length>1?"s":""}`);
  return el("span",{class:"rate",text:parts.join(" · ")});
}

function statusWord(b){

function waNumber(p){
  let d = (p||"").replace(/\D/g,"");
  if (d.length===11 && d.startsWith("0")) d = d.slice(1);
  if (d.length===10) d = "91" + d;
  return d.length>=11 && d.length<=15 ? d : "";
}
function waBtn(phone, label, msg){

const SITE = location.origin.startsWith("http") ? location.host : "the MICA Shelf";
function myPlace(){ return state.profile ? `${state.profile.name}, ${where(state.profile.block,state.profile.room)}` : ""; }

function alertText(b){
  if (b.ownerAlert) return b.ownerAlert;
  if (b.status==="requested") return `${b.borrowerName||"Someone"} wants to borrow "${b.title}"`;
  if (b.status==="returning") return `${b.borrowerName||"Your borrower"} says they've returned "${b.title}". Confirm it's back.`;
  const wl = b.waitlist||[];
  if (b.status==="available" && wl.length) return `${wl[0].name} is waiting for "${b.title}". Lend it to them when you can.`;
  return "";
}
const alertKey = b => ["own",b.id,b.status,b.borrowerId||"",b.ownerAlert||"",((b.waitlist||[])[0]||{}).id||""].join("|");

/* Everything that should show up under the bell, for this person. */
function notifications(){
  if (!state.uid) return [];
  const out = [], now = Date.now(), DAY = 864e5;
  for (const b of state.books){
    if (needsOwner(b)) out.push({key:alertKey(b), id:b.id, text:alertText(b), act:true, at:b.requestedAt||b.borrowedAt||b.createdAt||0});
    if (b.borrowerId===state.uid && b.status==="borrowed"){
      if (b.borrowedAt && now - b.borrowedAt < 3*DAY)
        out.push({key:`got|${b.id}|${b.borrowedAt}`, id:b.id, text:`You've got "${b.title}" from ${b.ownerName||"its owner"}. Return by ${fmtDate(b.dueAt)}.`, at:b.borrowedAt});
      if (b.dueAt && b.dueAt - now < 2*DAY){
        const late = b.dueAt < now;
        out.push({key:`due|${b.id}|${b.borrowedAt}|${late?"late":"soon"}`, id:b.id, act:true, at:b.dueAt,
          text: late ? `"${b.title}" was due ${fmtDate(b.dueAt)}. Please return it or pass it on.` : `"${b.title}" is due ${fmtDate(b.dueAt)}.`});
      }
    }
    const wl = b.waitlist||[];
    if (wl[0] && wl[0].id===state.uid && b.status!=="available")
      out.push({key:`next|${b.id}|${b.borrowerId||""}`, id:b.id, at:wl[0].at||0,
        text:`You're next for "${b.title}". ${b.borrowerName||"The current reader"} has it now.`});
  }
  return out.sort((x,y)=>(y.act?1:0)-(x.act?1:0) || (y.at||0)-(x.at||0));
}

const seenKey = () => `shelf-seen-${state.uid}`;
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem(seenKey())||"[]")); }catch(e){ return new Set(); } }
function saveSeen(set){ try{ localStorage.setItem(seenKey(), JSON.stringify([...set].slice(-300))); }catch(e){} }
const poppedThisVisit = new Set(); let popSeeded = false;

function renderBell(){
  const bell = $("#bell"), count = $("#bellCount");
  if (!state.uid || !state.loaded){ bell.hidden = true; $("#bellPanel").hidden = true; document.title = "The MICA Shelf"; return; }
  bell.hidden = false;
  const items = notifications(), seen = loadSeen();
  const unseen = items.filter(n=>!seen.has(n.key)).length;
  count.hidden = !unseen; count.textContent = unseen > 9 ? "9+" : unseen;
  bell.setAttribute("aria-label", unseen ? `Notifications, ${unseen} new` : "Notifications");
  document.title = unseen ? `(${unseen}) The MICA Shelf` : "The MICA Shelf";

  // device pop-ups for anything new since this visit started
  if (popSeeded && "Notification" in window && Notification.permission==="granted"){
    items.forEach(n=>{ if (!poppedThisVisit.has(n.key) && !seen.has(n.key)){
      try{ const p = new Notification("The MICA Shelf", {body:n.text, tag:n.key}); p.onclick = ()=>{ window.focus(); openBook(n.id); p.close(); }; }catch(e){}
    }});
  }
  items.forEach(n=>poppedThisVisit.add(n.key)); popSeeded = true;

  if (!$("#bellPanel").hidden) fillBellPanel(items, seen);
}

function fillBellPanel(items, seen){
  const panel = $("#bellPanel"); panel.replaceChildren();

  items.forEach(n=>panel.append(el("button",{class:"bp-row"+(seen.has(n.key)?"":" new")+(n.act?" act":""),type:"button",
    onclick:()=>{ closeBell(); openBook(n.id); }},[
    el("span",{class:"dot","aria-hidden":"true"}), el("span",{class:"t",text:n.text})
  ])));
  const foot = el("div",{class:"bp-foot"});

    foot.append(el("p",{},["Add your WhatsApp number so borrowers can message you. ",
      el("button",{class:"btn link",type:"button",text:"Add it",onclick:()=>{ closeBell(); openProfile(); }})]));
  if ("Notification" in window && Notification.permission==="default")
    foot.append(el("button",{class:"btn",type:"button",text:"Pop up alerts on this device",onclick:async()=>{
      try{ const r = await Notification.requestPermission(); toast(r==="granted" ? "You'll get pop-ups while the shelf is open in a tab" : "Pop-ups are off for this browser"); }catch(e){}
      fillBellPanel(notifications(), loadSeen());
    }}));

function openBell(){

function rowFor(b, stateText, tone, sub){

const queuePos = b => (b.waitlist||[]).findIndex(p=>p.id===state.uid);

function renderMine(){
  const v = $("#viewMine"); v.replaceChildren();
  if (!state.uid){ v.append(el("div",{class:"empty"},[el("strong",{text:"Sign in to see your books"})])); return; }
  const mine = state.books.filter(b=>b.ownerId===state.uid);
  const waiting = mine.filter(needsOwner);
  const lent = mine.filter(b=>b.status==="borrowed" && !needsOwner(b));
  const idle = mine.filter(b=>b.status==="available" && !needsOwner(b));
  const borrowing = state.books.filter(b=>b.borrowerId===state.uid);
  const queued = state.books.filter(b=>queuePos(b)>=0);
  const now = Date.now();

  const group = (title, items, mk) => {
    if (!items.length) return;
    v.append(el("div",{class:"group"},[el("h2",{text:title}), ...items.map(mk)]));
  };
  group("Waiting on you", waiting, b=>{
    if (b.ownerAlert) return rowFor(b, "Passed on", "warn", b.ownerAlert);
    if (b.status==="requested") return rowFor(b, `${b.borrowerName||"Someone"} wants it`, "warn");
    if (b.status==="returning") return rowFor(b, "Confirm it's back", "warn");
    return rowFor(b, `${b.waitlist[0].name} is next`, "warn", "Back with you, and someone's waiting");
  });
  group("Books you're borrowing", borrowing, b=>{
    if (b.status==="requested") return rowFor(b,"Waiting for owner");
    if (b.status==="returning") return rowFor(b,"Owner confirming return");
    const late = b.dueAt && b.dueAt < now;
    const next = (b.waitlist||[])[0];
    return rowFor(b, late ? `Overdue since ${fmtDate(b.dueAt)}` : `Return by ${fmtDate(b.dueAt)}`, late?"warn":"",
      next ? `${next.name} wants it next` : `from ${b.ownerName||"a MICA reader"}`);
  });
  group("You're in line for", queued, b=>{
    const pos = queuePos(b);
    return rowFor(b, pos===0 ? "You're next" : `#${pos+1} in line`, pos===0?"ok":"", `Now with ${b.borrowerName||"the owner"}`);
  });
  group("Lent out", lent, b=>{
    const late = b.dueAt && b.dueAt < now;
    return rowFor(b, late ? "Overdue" : `Due ${fmtDate(b.dueAt)}`, late?"warn":"", `With ${b.borrowerName||"someone"}, ${where(b.borrowerBlock,b.borrowerRoom)}`);
  });
  group("On the shelf", idle, b=>rowFor(b, b.timesBorrowed ? `Read by ${b.timesBorrowed}` : "Not lent yet", "ok"));

  if (!v.children.length){
    v.append(el("div",{class:"empty"},[
      el("strong",{text:"Nothing here yet"}),
      el("span",{text:"Books you lend, borrow and queue for show up here, along with anything you need to answer."}),
      el("div",{style:"margin-top:16px"},[el("button",{class:"btn primary",type:"button",onclick:openAdd,disabled:!state.canWrite||!state.db,text:"Lend a book"})])
    ]));
  }
}

/* ---------- dialogs ---------- */
function showDialog(kind){ const d=$("#dlg"); d.dataset.kind=kind; if(!d.open) d.showModal(); }
$("#dlg").addEventListener("close",()=>{ state.openId=null; state.reviewEditing=null; });
$("#dlg").addEventListener("click",e=>{ if(e.target.id==="dlg") $("#dlg").close(); });
const closeBtn = () => el("button",{class:"close",type:"button","aria-label":"Close",onclick:()=>$("#dlg").close(),text:"×"});

function refill(id){ const x = state.books.find(y=>y.id===id); if (x) fillBook(x); }
function openBook(id, tab){
  const b = state.books.find(x=>x.id===id); if(!b) return;
  if (state.openId !== id || tab) state.bookTab = tab || "about";
  state.reviewEditing = null;
  state.openId = id; fillBook(b); showDialog("book");
  if (b.ownerAlert && b.ownerId===state.uid && state.canWrite && !state.readOnly){
    bookRef(b.id).update({ownerAlert:null}).catch(()=>{});
  }
}

const me_ = () => ({id:state.uid, name:state.profile.name, block:state.profile.block||"", room:state.profile.room||"", phone:state.profile.phone||"", at:Date.now()});
const trim = j => (j||[]).slice(-40);

/* Fetch the latest copy before changing the queue or holder, so two people acting at once don't clobber each other. */
async function fresh(b){ const s = await bookRef(b.id).get(); return s.exists ? {id:b.id, ...s.data()} : null; }

async function lendTo(b, p, kind, fromName){
  const cur = await fresh(b); if(!cur){ toast("That book was removed."); return; }
  const wl = (cur.waitlist||[]).filter(x=>x.id!==p.id);
  const fields = {status:"borrowed", borrowerId:p.id, borrowerName:p.name, borrowerBlock:p.block||"", borrowerRoom:p.room||"", borrowerPhone:p.phone||"",
    requestedAt:null, borrowedAt:Date.now(), dueAt:Date.now()+LOAN_DAYS*864e5, waitlist:wl,
    journey:trim([...(cur.journey||[]), {kind, from:fromName, to:p.name, at:Date.now()}])};
  if (kind==="passed"){
    fields.ownerAlert = `${fromName} passed it to ${p.name} (${where(p.block,p.room)})`;
    fields.timesBorrowed = (cur.timesBorrowed||0)+1;
  }
  return write(()=>bookRef(b.id).update(fields), kind==="passed" ? `Passed to ${p.name}` : `Lent to ${p.name}`);
}

function journeyEl(b, isOwner){
  const j = b.journey||[];
  if (!j.length) return null;
  const list = el("ol",{class:"trail"});
  j.slice(-8).forEach(s=>{
    const verb = s.kind==="returned" ? `${s.from} returned it to ${s.to}` : s.kind==="passed" ? `${s.from} passed it to ${s.to}` : `${s.from} lent it to ${s.to}`;
    list.append(el("li",{},[el("span",{text:verb}), el("time",{text:fmtDate(s.at)})]));
  });
  return el("details",{class:"journey",open:isOwner},[el("summary",{text:`Where it's been (${j.length} hand-off${j.length>1?"s":""})`}), list]);
}

function fillBook(b){
  const body = $("#dlgBody"); body.replaceChildren();
  const me = state.uid, isOwner = me && b.ownerId===me, isHolder = me && b.borrowerId===me;
  const wl = b.waitlist||[], pos = queuePos(b), next = wl[0];
  const passOn = b.passOn !== false;
  const now = Date.now();

  body.append(el("div",{class:"dlg-head"},[
    coverEl(b,"lg"),
    el("div",{},[el("h2",{text:b.title}), el("p",{class:"by",text:[b.author, b.genre].filter(Boolean).join(", ")}), rateLine(b.id)]),
    closeBtn()
  ]));
  const revs = reviewsFor(b.id);
  const tabBtn = (key, label) => el("button",{type:"button",role:"tab","aria-selected":String(state.bookTab===key),
    onclick:()=>{ state.bookTab=key; state.reviewEditing=null; refill(b.id); }, text:label});
  body.append(el("div",{class:"dtabs",role:"tablist"},[tabBtn("about","About"), tabBtn("reviews", `Reviews${revs.length?` (${revs.length})`:""}`)]));
  if (state.bookTab==="reviews"){ renderReviews(body, b, revs); return; }
  if (b.note) body.append(el("p",{class:"note",text:b.note}));
  body.append(el("dl",{class:"facts"},[
    el("dt",{text:"Owner"}), el("dd",{text:isOwner ? "You" : (b.ownerName||"A MICA reader")}),
    el("dt",{text:"Owner's room"}), el("dd",{text:where(b.ownerBlock,b.ownerRoom)}),
    el("dt",{text:"Passing on"}), el("dd",{text: passOn ? "Borrowers can hand it to the next person" : "Comes back to the owner each time"}),
    el("dt",{text:"Read by"}), el("dd",{text: b.timesBorrowed ? `${b.timesBorrowed} ${b.timesBorrowed>1?"people":"person"}` : "No one yet"})
  ]));

  if (isOwner && b.ownerAlert) body.append(el("div",{class:"alert",text:b.ownerAlert}));

  // Where is it right now?
  let line = "";
  const holder = `${b.borrowerName||"someone"} (${where(b.borrowerBlock,b.borrowerRoom)})`;
  if (b.status==="available") line = isOwner ? "It's with you." : "Available now. Pick it up from the owner's room.";
  if (b.status==="requested") line = isHolder ? "You've asked for this. The owner will mark it handed over once you have it."
     : isOwner ? `${holder} wants to borrow this. Mark it handed over once they have it.`
     : "Someone has asked for this. Join the line to be next.";
  if (b.status==="borrowed"){
    const late = b.dueAt && b.dueAt<now;
    line = isHolder ? `You have this. ${passOn && next ? "Pass it on or return it" : "Return it"} by ${fmtDate(b.dueAt)}.${late?" It's overdue.":""}`
      : `Right now it's with ${holder}, due ${fmtDate(b.dueAt)}.${late?" Overdue.":""}`;
  }
  if (b.status==="returning") line = isOwner ? `${b.borrowerName||"The borrower"} says they've returned it. Confirm once it's back with you.`
     : isHolder ? "Marked as returned. Waiting for the owner to confirm." : "On its way back to the owner.";
  body.append(el("div",{class:"status-line"},[el("b",{text:"Where it is: "}), line]));

  // Message the right person on WhatsApp
  const T = `"${b.title}"`;
  let nudge = null;
  if (isHolder && b.status==="requested"){
    const btn = waBtn(b.ownerPhone, `Message ${b.ownerName||"the owner"} on WhatsApp`,
      `Hi ${b.ownerName||""}! I've asked to borrow ${T} on The MICA Shelf (${SITE}). When can I come pick it up? – ${myPlace()}`);
    nudge = el("div",{class:"nudge"},[
      el("b",{text:"One more step: let them know"}),
      el("span",{text: btn ? `${b.ownerName||"The owner"} sees your request when they open the shelf. A quick message makes sure they don't miss it.`
                           : `${b.ownerName||"The owner"} hasn't added a WhatsApp number yet. They'll see your request when they open the shelf, or drop by ${where(b.ownerBlock,b.ownerRoom)}.`}),
      btn]);
  } else if (isOwner && (b.status==="requested" || b.status==="returning")){
    const btn = waBtn(b.borrowerPhone, `Message ${b.borrowerName||"them"} on WhatsApp`,
      b.status==="requested" ? `Hi ${b.borrowerName||""}! Saw your request for ${T} on The MICA Shelf. You can pick it up from ${where(b.ownerBlock,b.ownerRoom)}. When works for you?`
                             : `Hi ${b.borrowerName||""}! About ${T} from The MICA Shelf: I haven't got it back yet. Where did you leave it?`);
    if (btn) nudge = el("div",{class:"nudge soft"},[btn]);
  } else if (next && ((isHolder && b.status==="borrowed" && passOn) || (isOwner && b.status==="available"))){
    const btn = waBtn(next.phone, `Message ${next.name} on WhatsApp`,
      `Hi ${next.name}! You're next in line for ${T} on The MICA Shelf. When can I hand it to you? – ${myPlace()}`);
    if (btn) nudge = el("div",{class:"nudge soft"},[btn]);
  } else if (isHolder && b.status==="borrowed"){
    const btn = waBtn(b.ownerPhone, `Message ${b.ownerName||"the owner"}`, `Hi ${b.ownerName||""}! About ${T} from The MICA Shelf: `);
    if (btn) nudge = el("div",{class:"nudge soft"},[btn]);
  }
  if (nudge) body.append(nudge);

  if (wl.length && (isOwner || isHolder || pos>=0)){
    const q = el("ol",{class:"queue"});
    wl.forEach((p,i)=>q.append(el("li",{text: (p.id===me ? "You" : p.name) + (isOwner||isHolder ? `, ${where(p.block,p.room)}` : "")})));
    body.append(el("div",{class:"queue-box"},[el("b",{text:"Waiting to read it"}), q]));
  } else if (wl.length){
    body.append(el("p",{class:"hint",text:`${wl.length} ${wl.length>1?"people are":"person is"} waiting to read this.`}));
  }

  const j = journeyEl(b, isOwner); if (j) body.append(j);

  const acts = el("div",{class:"actions"});
  const can = state.db && state.canWrite && !state.readOnly && me;
  const A = (text, fn, cls="btn") => el("button",{class:cls,type:"button",disabled:!can,onclick:fn,text});
  const ownerName = b.ownerName||"the owner";

  if (isOwner){
    if (b.status==="available"){
      acts.append(A("Remove from shelf", ()=>removeBook(b), "btn danger"), A("Edit", ()=>openAdd(b)));
      if (next) acts.append(A(`Lend to ${next.name}`, ()=>lendTo(b, next, "lent", "You"), "btn primary"));
    }
    if (b.status==="requested"){
      acts.append(A("Decline", ()=>write(()=>bookRef(b.id).update(clearLoan()), "Request declined")),
        A("Mark handed over", async ()=>{
          const cur = await fresh(b); if(!cur) return;
          write(()=>bookRef(b.id).update({status:"borrowed",borrowedAt:Date.now(),dueAt:Date.now()+LOAN_DAYS*864e5,
            journey:trim([...(cur.journey||[]),{kind:"lent",from:cur.ownerName||"Owner",to:cur.borrowerName||"Someone",at:Date.now()}])}), "Marked as borrowed");
        }, "btn primary"));
    }
    if (b.status==="borrowed" || b.status==="returning"){
      acts.append(A("It's back with me", async ()=>{
        const cur = await fresh(b); if(!cur) return;
        const viaPass = (cur.journey||[]).some(s=>s.kind==="passed" && s.to===cur.borrowerName);
        write(()=>bookRef(b.id).update({...clearLoan(), ownerAlert:null,
          timesBorrowed: viaPass ? (cur.timesBorrowed||0) : (cur.timesBorrowed||0)+1,
          journey:trim([...(cur.journey||[]),{kind:"returned",from:cur.borrowerName||"Borrower",to:cur.ownerName||"Owner",at:Date.now()}])}), "Back with you");
      }, "btn primary"));
    }
  } else if (isHolder){
    if (b.status==="requested") acts.append(A("Cancel request", ()=>write(()=>bookRef(b.id).update(clearLoan()), "Request cancelled")));
    if (b.status==="borrowed"){
      acts.append(A(`Returned to ${ownerName}`, ()=>write(()=>bookRef(b.id).update({status:"returning"}), "Marked as returned")));
      if (passOn && next) acts.append(A(`Passed to ${next.name}`, ()=>{
        if (confirm(`Hand "${b.title}" to ${next.name}? ${ownerName} will see that it's with them now.`)) lendTo(b, next, "passed", state.profile?.name || b.borrowerName || "Borrower");
      }, "btn hot"));
    }
  } else {
    if (b.status==="available" && !wl.length) acts.append(A("Ask to borrow", ()=>requestBook(b), "btn hot"));
    else if (pos>=0) acts.append(A("Leave the line", async ()=>{
      const cur = await fresh(b); if(!cur) return;
      write(()=>bookRef(b.id).update({waitlist:(cur.waitlist||[]).filter(p=>p.id!==me)}), "You've left the line");
    }));
    else acts.append(A(b.status==="available" ? "Join the line" : "Ask to read it next", ()=>joinLine(b), "btn hot"));
  }
  if (!isHolder && !isOwner && pos>=0) body.append(el("p",{class:"hint",text: pos===0 ? (passOn ? "You're next. The current reader can hand it straight to you." : `You're next. ${ownerName} will lend it to you when it's back.`) : `You're #${pos+1} in line.`}));
  if (acts.children.length) body.append(acts);
}
function renderReviews(body, b, revs){
  const wrap = el("div",{class:"reviews"});
  if (state.reviewsError){
    wrap.append(el("div",{class:"notice",text:"Reviews can't load yet. The database rules need the review section added (see the updated firestore.rules)."}));
    body.append(wrap); return;
  }
  const st = ratingStats(revs);
  wrap.append(el("div",{class:"rv-sum"}, st.count
    ? [el("span",{class:"big",text:st.avg.toFixed(1)}), el("span",{class:"stars","aria-label":`${st.avg.toFixed(1)} out of 5`,text:starsText(st.avg)}), el("span",{class:"hint",text:`from ${st.count} rating${st.count>1?"s":""}`})]
    : [el("span",{class:"hint",text: revs.length ? "No star ratings yet." : "No reviews yet. Be the first Mican to say what you thought."})]));
  const mine = revs.find(r=>r.uid===state.uid);
  if (!mine || state.reviewEditing===b.id) wrap.append(reviewForm(b, mine));
  const list = el("div",{class:"rv-list"});
  revs.forEach(r=>{
    const isMe = r.uid===state.uid;
    if (isMe && state.reviewEditing===b.id) return;
    list.append(el("article",{class:"rv"+(isMe?" mine":"")},[
      el("header",{},[
        el("b",{text: isMe ? "You" : (r.name||"A Mican")}),
        r.uid===b.ownerId ? el("span",{class:"tag",text:"Owner"}) : null,
        r.rating ? el("span",{class:"stars","aria-label":`${r.rating} out of 5`,text:starsText(r.rating)}) : null,
        el("time",{text:fmtDate(r.updatedAt||r.createdAt)})
      ]),
      r.text ? el("p",{text:r.text}) : null,
      isMe ? el("div",{class:"rv-acts"},[
        el("button",{class:"btn link",type:"button",text:"Edit",onclick:()=>{ state.reviewEditing=b.id; refill(b.id); }}),
        el("button",{class:"btn link",type:"button",text:"Delete",onclick:async()=>{
          if (!confirm("Delete your review?")) return;
          await write(()=>state.db.doc(`books/${b.id}/reviews/${state.uid}`).delete(), "Review deleted");
        }})
      ]) : null
    ]));
  });
  wrap.append(list);
  body.append(wrap);
}

function reviewForm(b, mine){
  let rating = (mine && mine.rating) || 0;
  const pick = el("div",{class:"star-pick",role:"radiogroup","aria-label":"Your rating (optional)"});
  const paint = () => [...pick.children].forEach((s,i)=>{ s.textContent = i<rating ? "★" : "☆"; s.setAttribute("aria-checked", String(i+1===rating)); });
  for (let i=1;i<=5;i++) pick.append(el("button",{type:"button",role:"radio","aria-label":`${i} star${i>1?"s":""}`,
    onclick:()=>{ rating = rating===i ? 0 : i; state.reviewEditing=b.id; paint(); }}));
  paint();
  const text = el("textarea",{maxlength:1500,placeholder:"What did you think? Flag spoilers before you share them."});
  text.value = (mine && mine.text) || "";
  text.addEventListener("input",()=>{ state.reviewEditing=b.id; });
  const form = el("form",{class:"fields rv-form"},[
    el("b",{text: mine ? "Edit your review" : "Read it? Leave a review"}),
    pick, text,
    el("div",{class:"actions"},[
      mine ? el("button",{class:"btn",type:"button",text:"Cancel",onclick:()=>{ state.reviewEditing=null; refill(b.id); }}) : null,
      el("button",{class:"btn hot",type:"submit",text: mine ? "Save review" : "Post review"})
    ])
  ]);
  form.onsubmit = e=>{
    e.preventDefault();
    const t = text.value.trim();
    if (!t && !rating){ toast("Add a star rating or a few words first."); return; }
    needProfile(async ()=>{
      const now = Date.now();
      const ok = await write(()=>state.db.doc(`books/${b.id}/reviews/${state.uid}`).set({
        bookId:b.id, uid:state.uid, name:state.profile.name, rating, text:t,
        createdAt:(mine && mine.createdAt) || now, updatedAt:now
      }), mine ? "Review updated" : "Review posted");
      if (ok){ state.reviewEditing=null; openBook(b.id, "reviews"); }
    });
  };
  return form;
}

function clearLoan(){ return {status:"available",borrowerId:null,borrowerName:null,borrowerBlock:null,borrowerRoom:null,borrowerPhone:null,requestedAt:null,borrowedAt:null,dueAt:null}; }

function joinLine(b){
  needProfile(async ()=>{
    const cur = await fresh(b).catch(()=>null); if(!cur) return;
    if ((cur.waitlist||[]).some(p=>p.id===state.uid) || cur.borrowerId===state.uid){ openBook(b.id); return; }
    await write(()=>bookRef(b.id).update({waitlist:[...(cur.waitlist||[]), me_()]}), "You're in line");
    openBook(b.id);
  });
}

async function removeBook(b){
  if (!confirm(`Take "${b.title}" off the shelf?`)) return;
  const ok = await write(()=>bookRef(b.id).delete(), "Removed");
  if (ok) $("#dlg").close();
}

function needProfile(then){
  if (state.profile && state.profile.name && !state.profile._guess) return then();
  openProfile(then);
}

function requestBook(b){
  needProfile(async ()=>{
    const p = state.profile;
    const cur = await fresh(b).catch(()=>null);
    if (cur && cur.status!=="available"){ toast("Someone asked for it just before you. Join the line instead."); openBook(b.id); return; }
    await write(()=>bookRef(b.id).update({status:"requested",borrowerId:state.uid,borrowerName:p.name,borrowerBlock:p.block||"",borrowerRoom:p.room||"",borrowerPhone:p.phone||"",requestedAt:Date.now()}), "Request sent");
    openBook(b.id);
  });
}

function openProfile(then){
  const p = state.profile || {};
  const body = $("#dlgBody"); body.replaceChildren();
  const form = el("form",{class:"fields"});
  const name = el("input",{name:"name",required:true,maxlength:60,value:p.name||"",autocomplete:"name"});
  const block = el("input",{name:"block",maxlength:40,value:p.block||"",placeholder:"e.g. Hostel B"});
  const room = el("input",{name:"room",maxlength:12,value:p.room||"",placeholder:"e.g. 214"});
  const phone = el("input",{name:"phone",type:"tel",maxlength:16,value:p.phone||"",placeholder:"e.g. 98765 43210",autocomplete:"tel"});
  form.append(
    el("label",{},["Your name",name]),
    el("div",{class:"pair"},[el("label",{},["Hostel or block",block]), el("label",{},["Room",room])]),
    el("label",{},["WhatsApp number (recommended)",phone]),
    el("span",{class:"hint",text:"Your name and room show on books you lend and borrow. Your WhatsApp number is only used for the \"Message on WhatsApp\" buttons, so people can tell you about requests, but anyone signed in to the shelf could find it."}),
    el("div",{class:"actions"},[el("button",{class:"btn",type:"button",onclick:()=>$("#dlg").close(),text:"Cancel"}), el("button",{class:"btn primary",type:"submit",text:"Save details"})])
  );
  form.onsubmit = async e=>{
    e.preventDefault();
    const data = {name:name.value.trim(), block:block.value.trim(), room:room.value.trim(), phone:phone.value.trim()};
    if (!data.name) return;
    if (data.phone && !waNumber(data.phone)){ toast("That number doesn't look right. Use a 10-digit mobile number."); return; }
    const ok = await write(()=>state.db.doc(`users/${state.uid}`).set(data), "Details saved");
    if (ok){
      state.profile = data;
      // keep the owner details on every book you've listed up to date
      state.books.filter(b=>b.ownerId===state.uid).forEach(b=>{
        bookRef(b.id).update({ownerName:data.name, ownerBlock:data.block, ownerRoom:data.room, ownerPhone:data.phone}).catch(()=>{});
      });
      $("#dlg").close(); if (then) then();
    }
  };
  body.append(el("div",{class:"dlg-head"},[el("div",{},[el("h2",{text:"Your details"}), el("p",{class:"by",text:"So borrowers and lenders know who you are and where to come."})]), closeBtn()]), form);
  state.openId = null; showDialog("profile"); setTimeout(()=>name.focus(),30);
}

function tidyGenre(v){
  v = (v||"").trim().replace(/\s+/g," ");
  if (!v) return "Other";
  const match = GENRES.find(g=>g.toLowerCase()===v.toLowerCase());
  return match || v.charAt(0).toUpperCase() + v.slice(1);
}
function openAdd(existing){
  if (existing instanceof Event) existing = null;
  needProfile(()=>{
    const b = existing || {};
    const body = $("#dlgBody"); body.replaceChildren();
    const form = el("form",{class:"fields"});
    const title = el("input",{name:"title",required:true,maxlength:120,value:b.title||""});
    const author = el("input",{name:"author",maxlength:80,value:b.author||""});
    const genre = el("select",{name:"genre"});
    const custom = b.genre && !GENRES.includes(b.genre);
    const startGenre = custom ? "Other" : (b.genre||"Fiction");
    GENRES.forEach(g=>genre.append(el("option",{value:g,text:g,selected:startGenre===g})));
    const otherGenre = el("input",{name:"otherGenre",maxlength:40,placeholder:"e.g. Cricket, Cookbooks, Urdu poetry",value: custom ? b.genre : ""});
    const otherWrap = el("label",{},["Type the genre",otherGenre]);
    const syncOther = () => { otherWrap.hidden = genre.value!=="Other"; otherGenre.required = genre.value==="Other"; };
    genre.addEventListener("change",()=>{ syncOther(); if (genre.value==="Other") otherGenre.focus(); });
    syncOther();
    const note = el("textarea",{name:"note",maxlength:600,placeholder:"What's it about, and why should someone on campus read it?"});
    note.value = b.note||"";
    const passOn = el("input",{type:"checkbox",name:"passOn"}); passOn.checked = b.passOn !== false;
    form.append(
      el("label",{},["Title",title]),
      el("div",{class:"pair"},[el("label",{},["Author",author]), el("label",{},["Genre",genre])]),
      otherWrap,
      el("label",{},["Why read it",note]),
      el("label",{class:"check"},[passOn, el("span",{text:"Borrowers can pass it straight to the next person in line. You'll always see who has it."})]),
      el("span",{class:"hint",text:`Borrowers will pick it up from ${where(state.profile.block,state.profile.room)}. Change that in Your details.`}),
      el("div",{class:"actions"},[el("button",{class:"btn",type:"button",onclick:()=>$("#dlg").close(),text:"Cancel"}), el("button",{class:"btn primary",type:"submit",text: existing?"Save changes":"Put it on the shelf"})])
    );
    form.onsubmit = async e=>{
      e.preventDefault();
      const p = state.profile;
      const fields = {title:title.value.trim(), author:author.value.trim(), genre: genre.value==="Other" ? tidyGenre(otherGenre.value) : genre.value, note:note.value.trim(), passOn:passOn.checked,
                      ownerName:p.name, ownerBlock:p.block||"", ownerRoom:p.room||"", ownerPhone:p.phone||""};
      if (!fields.title) return;
      let ok;
      if (existing) ok = await write(()=>bookRef(existing.id).update(fields), "Changes saved");
      else ok = await write(()=>state.db.collection("books").add({...fields, ownerId:state.uid, color:Math.floor(Math.random()*SPINES.length),
                 ...clearLoan(), waitlist:[], journey:[], ownerAlert:null, timesBorrowed:0, createdAt:Date.now()}), "On the shelf");
      if (ok) $("#dlg").close();
    };
    body.append(el("div",{class:"dlg-head"},[el("div",{},[el("h2",{text: existing?"Edit book":"Lend a book"})]), closeBtn()]), form);
    state.openId = null; showDialog("add"); setTimeout(()=>title.focus(),30);
  });
}
$("#addBtn").onclick = ()=>openAdd();
$("#profileBtn").onclick = ()=>openProfile();

boot();
</script>
</body>
